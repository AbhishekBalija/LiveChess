name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: livechess
          POSTGRES_PASSWORD: livechess
          POSTGRES_DB: livechess_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U livechess"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests only run when these are set, so CI sets them.
      TEST_DATABASE_URL: postgresql://livechess:livechess@localhost:5432/livechess_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-server-${{ hashFiles('server/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Migrate test database
        run: bun run migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: bun run typecheck
      - run: bun run test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-client-${{ hashFiles('client/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit -p tsconfig.app.json
      - run: bun run test
      - run: bun run build
