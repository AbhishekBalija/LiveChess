name: Bug report
description: Something is broken or wrong
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `bun run dev`
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game or round
      description: Lichess round or game link, if the bug is about a specific game.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, environment
      description: Browser, OS, and any console or server log lines.
